# Port ACLs
acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 443         # https
acl CONNECT method CONNECT

# Block private/internal destinations (host network, other containers, localhost)
acl to_localnet dst 127.0.0.0/8
acl to_localnet dst 10.0.0.0/8
acl to_localnet dst 172.16.0.0/12
acl to_localnet dst 192.168.0.0/16
acl to_localnet dst 169.254.0.0/16    # link-local / cloud metadata
acl to_localnet dst fc00::/7          # IPv6 ULA
acl to_localnet dst fe80::/10         # IPv6 link-local

# Deny rules first
http_access deny to_localnet
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Define allowed domains (leading dot acts as wildcard for subdomains)

# AI services
acl allowed_domains dstdomain .anthropic.com
acl allowed_domains dstdomain .claude.ai platform.claude.com
acl allowed_domains dstdomain .opencode.ai

# Git hosting
acl allowed_domains dstdomain .github.com .githubusercontent.com

# Go toolchain
acl allowed_domains dstdomain .golang.org .go.dev
acl allowed_domains dstdomain storage.googleapis.com

# Package registries
acl allowed_domains dstdomain .npmjs.org .npmjs.com

# Allow traffic only to whitelisted domains
http_access allow allowed_domains
http_access deny all

http_port 3128
dns_nameservers 1.1.1.1 1.0.0.1
